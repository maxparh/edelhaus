<!-- orders/order_edit.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать заказ — EdelHaus</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles/base.css' %}">
    <link rel="stylesheet" href="{% static 'styles/tables.css' %}">
    <link rel="stylesheet" href="{% static 'styles/forms.css' %}">
</head>
<body>
    <div class="header">EdelHaus</div>

    <div class="form-container">
        <div class="back-container">
            <a href="{% url 'orders' %}" class="back-link">← Назад к списку заказов</a>
        </div>
        <div class="form">
            <h2>Редактировать заказ №{{ order.order_id }}</h2>

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="client_id">Клиент</label>
                    <select id="client_id" name="client_id">
                        <option value="">— Не выбран —</option>
                        {% for client in clients %}
                            <option value="{{ client.client_id }}" {% if client.client_id == order.client_id %}selected{% endif %}>
                                {{ client.client_name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="order_date">Дата заказа <span class="important-span">*</span></label>
                    <input type="date" id="order_date" name="order_date" value="{{ order.order_date|date:'Y-m-d' }}" required>
                </div>

                <div class="form-group">
                    <label for="delivery_company">Компания доставки</label>
                    <input type="text" id="delivery_company" name="delivery_company" value="{{ order.delivery_company|default:'' }}">
                </div>

                <div class="form-group">
                    <label for="order_status">Статус <span class="important-span">*</span></label>
                    <select id="order_status" name="order_status" required>
                        <option value="">— Выберите статус —</option>
                        <option value="Принят" {% if order.order_status == "Принят" %}selected{% endif %}>Принят</option>
                        <option value="В обработке" {% if order.order_status == "В обработке" %}selected{% endif %}>В обработке</option>
                        <option value="Выполняется" {% if order.order_status == "Выполняется" %}selected{% endif %}>Выполняется</option>
                        <option value="Выполнен" {% if order.order_status == "Выполнен" %}selected{% endif %}>Выполнен</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="order_total">Сумма (руб.)</label>
                    <input type="number" step="0.01" id="order_total" name="order_total" value="{{ order.order_total|default:'' }}">
                </div>
                
                <button type="submit" class="btn-form">Сохранить</button>
            </form>
        </div>
    </div>
</body>
</html>
