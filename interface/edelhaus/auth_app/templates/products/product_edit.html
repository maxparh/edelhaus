<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать товар — EdelHaus</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles/base.css' %}">
    <link rel="stylesheet" href="{% static 'styles/tables.css' %}">
    <link rel="stylesheet" href="{% static 'styles/forms.css' %}">
</head>
<body>
    <div class="header">EdelHaus</div>

    <div class="form-container">
        <div class="back-container">
            <a href="{% url 'products' %}" class="back-link">← Назад к списку товаров</a>
        </div>
        <div class="form">
            <h2>Редактировать товар</h2>

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="product_name">Название товара <span class="important-span">*</span></label>
                    <input type="text" id="product_name" name="product_name" value="{{ product.product_name|default_if_none:'' }}" required>
                </div>

                <div class="form-group">
                    <label for="product_price">Цена (руб.) <span class="important-span">*</span></label>
                    <input type="number" step="0.01" id="product_price" name="product_price" value="{{ product.product_price|default_if_none:'' }}" required>
                </div>

                <div class="form-group">
                    <label for="product_material">Материал</label>
                    <input type="text" id="product_material" name="product_material" value="{{ product.product_material|default_if_none:'' }}">
                </div>

                <div class="form-group">
                    <label for="supplier_id">Поставщик</label>
                    <select id="supplier_id" name="supplier_id">
                        <option value="">-- Без поставщика --</option>
                        {% for s in suppliers %}
                            <option value="{{ s.supplier_id }}" {% if product.supplier and product.supplier.supplier_id == s.supplier_id %}selected{% endif %}>
                                {{ s.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="product_weight">Вес (кг)</label>
                    <input type="number" step="0.001" id="product_weight" name="product_weight" value="{{ product.product_weight|default_if_none:'' }}">
                </div>

                <div class="form-group">
                    <label for="product_color">Цвет</label>
                    <input type="text" id="product_color" name="product_color" value="{{ product.product_color|default_if_none:'' }}">
                </div>

                <div class="form-group">
                    <label for="date_added">Дата добавления</label>
                    <input type="date" id="date_added" name="date_added" value="{{ product.date_added|date:'Y-m-d'|default_if_none:'' }}">
                </div>

                <button type="submit" class="btn-form">Сохранить</button>
            </form>
        </div>
    </div>
</body>
</html>
